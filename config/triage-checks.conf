# triage-checks.conf — declares the automated checks run by scripts/check-triage.sh.
#
# DATA FILE — this is the ONE file each project edits. One `check` call per triage item.
#
#   check <ID> <type> <target> <pattern> <note>
#
# Types: grep_present | grep_absent | file_present | file_absent | manual
#   grep_present  ✅ if <pattern> (extended regex, grep -E) is found in <target>
#   grep_absent   ✅ if <pattern> is NOT found in <target>   (missing file = ✅)
#   file_present/file_absent  ✅ on glob match / no-match
#   manual        ⚠ SKIP always — a human must verify
#
# Each ID matches a row in docs/TRIAGE.md so `check-triage.sh --update` can flip it.
# ─────────────────────────────────────────────────────────────────────────────

# T-001 — Tomcat CVE override still present in pom.xml
check T-001 grep_present "pom.xml"                                   '<tomcat\.version>10\.'          "Tomcat CVE override present"

# T-002 — ddl-auto not defaulting to 'update' (auto schema alter)
check T-002 grep_absent  "src/main/resources/application.properties" 'ddl-auto=\$\{[^}]+:update\}'    "ddl-auto not auto-altering schema"

# T-003 — SQL logging not hardcoded on
check T-003 grep_absent  "src/main/resources/application.properties" 'show-sql=true'                  "SQL logging not hardcoded on"

# T-004 — sb.api-key must not keep the weak 'apiKey' default  [security]
check T-004 grep_absent  "src/main/resources/application.properties" 'sb\.api-key=\$\{[^}]*:apiKey\}' "sb.api-key has no weak 'apiKey' default"

# T-005 — Cassandra credentials: needs a human / deployment check  [security]
check T-005 manual       ''                                          ''                               "Cassandra credentials commented out — enforce auth in prod"

# T-006 — DB credentials default to postgres:postgres: needs a human / deployment check  [security]
check T-006 manual       ''                                          ''                               "Ensure prod overrides DATABASE_USERNAME / DATABASE_PASSWORD"
