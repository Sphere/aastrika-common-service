# Application
spring.application.name=aastrika-service
server.port=7011

# NOTE: the Elasticsearch auto-configurations MUST stay excluded (spring-data-opensearch-starter puts
# Spring Data Elasticsearch on the classpath without the co.elastic.clients client, so they blow up at
# startup with NoClassDefFoundError). The exclusion lives in @SpringBootApplication(excludeName=...) on
# AastrikaCommonApplication, NOT here — a property is overridable per environment and was lost in stage.
# Do not re-add spring.autoconfigure.exclude here; it would be a second list free to drift.

# Datasource (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres?socketTimeout=60}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# Data lake datasource — a second PostgreSQL channel for ETL-populated tables that may live on
# another host. Currently used by the leaderboard only (leaderboard_table is ETL-fed).
#
# Each value defaults to the PRIMARY datasource's resolved setting, so with no DATA_LAKE_DB_*
# variables set both channels point at the same database — two Hikari pools, one server. That keeps
# the leaderboard working wherever the primary works. Point the data lake at its own host by setting
# DATA_LAKE_DB_URL / DATA_LAKE_DB_USERNAME / DATA_LAKE_DB_PASSWORD per environment (a Secret in k8s,
# env vars locally); no code or property change is needed to switch over.
#
# Two things to keep in mind when overriding:
#  - Write the URL default as a plain literal, never as a nested ${...} placeholder around a host.
#    Spring reads ${some.host:5432/db} as a placeholder key with everything after the first ':' as
#    its default, which silently strips the "jdbc:postgresql://host:" prefix.
#  - Supply passwords through the environment, not inline. CLAUDE.md forbids real secrets as
#    property defaults (TRIAGE T-006), and a password containing '{' cannot work inline anyway:
#    Spring counts a bare '{' as placeholder nesting, so the closing '}' never matches and the raw
#    "${...}" text is handed to the driver as the password. Environment values are not re-parsed,
#    so any characters pass through intact.
data-lake.datasource.url=${DATA_LAKE_DB_URL:${spring.datasource.url}}
data-lake.datasource.username=${DATA_LAKE_DB_USERNAME:${spring.datasource.username}}
data-lake.datasource.password=${DATA_LAKE_DB_PASSWORD:${spring.datasource.password}}
data-lake.datasource.driver-class-name=org.postgresql.Driver
data-lake.datasource.hikari.connection-timeout=30000
data-lake.datasource.hikari.idle-timeout=600000
data-lake.datasource.hikari.max-lifetime=1800000
data-lake.datasource.hikari.maximum-pool-size=${DATA_LAKE_DB_POOL_MAX_SIZE:5}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Passbook: comma-separated typeNames the read/update APIs accept (source key: user.passbook.supported.typename)
passbook.supported-type-names=${PASSBOOK_SUPPORTED_TYPE_NAMES:competency}

# Kafka (rating upsert emits an event to the ratings aggregation pipeline)
# Host clients use the PLAINTEXT_HOST listener (advertised as localhost:29092); localhost:9092
# advertises the in-docker name "kafka" which the host can't resolve. Override via env in-cluster.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
ratings.rating-event-topic=${RATING_EVENT_TOPIC:dev.rating.event}

# Rating aggregation consumer (in-service replacement for the Flink rating job).
# Single-threaded over the single-partition topic so per-activity read-modify-write stays correct.
# auto-offset-reset=latest: the aggregation is delta-based/non-idempotent, so we must NOT replay the
# historical backlog (that would double-count) — process only new events, then rely on committed offsets.
ratings.aggregation.enabled=${RATING_AGGREGATION_ENABLED:true}
ratings.failed-topic=${RATING_FAILED_TOPIC:rating.failedRating}
ratings.enrolment.keyspace=${ENROLMENT_KEYSPACE:sunbird_courses}
ratings.enrolment.table=${ENROLMENT_TABLE:user_enrolments}
spring.kafka.consumer.group-id=${RATING_CONSUMER_GROUP:aastrika-rating-aggregator}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.concurrency=1

# km content-search, shared by the cohort endpoints' batch lookup.
content.search-url=${CONTENT_SEARCH_URL:http://localhost:8080/v1/search}

# Assessment submit (POST /v2/user/assessment/submit): external user validation + content hierarchy
user.search-url=${USER_SEARCH_URL:http://localhost:8080/private/user/v1/search}
content.hierarchy-url=${CONTENT_HIERARCHY_URL:http://localhost:9000/content/v3/hierarchy}

# Cohorts (active-users / auto-enrollment).
# Batch search reuses content.search-url (the km content-search endpoint). Participants + user-courses
# reads and the auto-enrollment writes hit the course/LMS service; sb.api-key is the service key sent
# as the Authorization header (source: sb.api.key). Endpoint paths match the source verbatim.
cohorts.course.service-host=${COURSE_SERVICE_HOST:http://localhost:8080/}
cohorts.course.participants-endpoint=${COURSE_PARTICIPANTS_ENDPOINT:v1/batch/participants/list}
cohorts.course.user-courses-list=${COURSE_USER_COURSES_LIST:v1/user/courses/list/{userUUID}?orgdetails=orgName,email&licenseDetails=name,description,url&fields=contentType,topic,name,channel,mimeType,appIcon,gradeLevel,resourceType,identifier,medium,pkgVersion,board,subject,trackable,posterImage,duration,creatorLogo,license&batchDetails=name,endDate,startDate,status,enrollmentType,createdBy,certificates}
cohorts.course.batch-create-endpoint=${COURSE_BATCH_CREATE_ENDPOINT:v1/course/batch/create}
cohorts.course.enroll-endpoint=${COURSE_ENROLL_ENDPOINT:v1/course/enroll}
# Mandatory-content status check: learn-service course-progress read. NOTE: this is a FULL absolute
# URL (CourseClient uses it AS-IS; it is NOT prefixed with any host). Override per env.
learn-service.course.progress-endpoint=${COURSE_PROGRESS_ENDPOINT:http://localhost:9000/private/v1/content/state/read}
sb.api-key=${SB_API_KEY:apiKey}

# Cassandra (Spring Data - auto-configured CqlSession)
# The auto-configured CqlSession CONNECTS AT STARTUP: Cassandra must be reachable and
# the keyspace must already exist, or the app will not boot.
spring.cassandra.contact-points=${CASSANDRA_CONTACT_POINTS:localhost}
spring.cassandra.port=${CASSANDRA_PORT:9042}
spring.cassandra.local-datacenter=${CASSANDRA_LOCAL_DC:datacenter1}
spring.cassandra.keyspace-name=${CASSANDRA_KEYSPACE:sunbird}
# Uncomment and set if your cluster requires authentication:
#spring.cassandra.username=${CASSANDRA_USERNAME:}
#spring.cassandra.password=${CASSANDRA_PASSWORD:}
